[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronauts"
version = "0.1.0"
description = "Agent-based connectome recovery experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "urllib3<3",
    "charset-normalizer<4",
    "chardet<6",
    "numpy",
    "scipy",
    "truststore",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "pytest",
    "pandas",
]
cave = [
    "caveclient",
    "pandas",
]
topology = [
    "torch",
]
membrane = [
    "torch",
    "tifffile",
]
claude = [
    "anthropic>=0.25",
]
gemini = [
    "google-generativeai>=0.5",
]
llm = [
    "anthropic>=0.25",
    "google-generativeai>=0.5",
]

[project.scripts]
neuronauts = "neuronauts.run:main"

[tool.setuptools]
packages = ["neuronauts", "neuronauts.legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

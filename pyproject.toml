[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronauts"
version = "0.1.0"
description = "Reconstruct neurons from EM connectome (CAVE) synapses: lineage-supervised representation learning + synapse-graph cell assignment, scored as line-graph F1."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "urllib3<3",
    "charset-normalizer<4",
    "chardet<6",
    "numpy",
    "scipy",
    "truststore",
    "pyarrow",  # Arrow IPC payloads from the CAVE materialization API (data/lineage.py)
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "pytest",
    "pandas",
    "scikit-learn",
]
cave = [
    "caveclient",
    "pandas",
]
topology = [
    "torch",
]
membrane = [
    "torch",
    "tifffile",
]
claude = [
    "anthropic>=0.25",
]
gemini = [
    "google-generativeai>=0.5",
]
llm = [
    "anthropic>=0.25",
    "google-generativeai>=0.5",
]

[project.scripts]
neuronauts = "neuronauts.legacy.run:main"

[tool.setuptools]
# Kept explicit rather than auto-discovered so an attic move cannot silently
# ship retired code. The cost is that a NEW package must be added here: the
# 2026-09-02 audit built a wheel into a clean venv and found `import neuronauts`
# raising ModuleNotFoundError on `neuronauts.metrics` -- metrics, experiments
# and global_merge had all been added to the tree and never to this list, and
# the editable install hid it. Adding a package here without checking the wheel
# is how that recurs; `pip wheel . && pip install` into a scratch venv is the
# check.
packages = [
    "neuronauts",
    "neuronauts.legacy",
    "neuronauts.coassign",
    "neuronauts.data",
    "neuronauts.represent",
    "neuronauts.assemble",
    "neuronauts.meshing",
    "neuronauts.harness",
    "neuronauts.metrics",
    "neuronauts.experiments",
    "neuronauts.global_merge",
    "neuronauts.global_merge.eval",
    "neuronauts.report",
    "treestitch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "legacy: v1 agent/membrane simulation tests that exercise neuronauts.legacy; run with -m 'not legacy' to skip",
]

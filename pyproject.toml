[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronauts"
version = "0.1.0"
description = "Agent-based connectome recovery experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "urllib3<3",
    "charset-normalizer<4",
    "chardet<6",
    "numpy",
    "scipy",
    "truststore",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "pytest",
]
topology = [
    "torch",
]
membrane = [
    "torch",
    "tifffile",
]

[project.scripts]
neuronauts = "neuronauts.run:main"
neuronauts-qa = "neuronauts.qa_agent_cli:main"

[tool.setuptools]
packages = ["neuronauts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

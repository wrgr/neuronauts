<h1 id="what-is-a-connectome">What is a connectome?</h1>
<p>A <strong>connectome</strong> is a complete wiring diagram of a piece of brain tissue.</p>
<br />
<div class="columns">
<div>
<p><strong>Nodes = neurons</strong><br />
The computing cells of the brain. Each has a cell body plus long branching wires (axons and dendrites) that stretch up to <strong>millimeters</strong> through tissue.</p>
<p><strong>Edges = synapses</strong><br />
The junctions where one neuron passes a signal to another. Each synapse has a <em>sender</em> (pre-synaptic) and a <em>receiver</em> (post-synaptic) side.</p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>   neuron A  ╮
      ╲       ╲
   synapse     ● ← signal passes here
      ╱       ╱
   neuron B  ╯
</code></pre>
<br />
<p>The <strong>structure</strong> of this wiring — who connects to whom — is the physical substrate of computation in the brain. It's a prerequisite for understanding vision, memory, movement.</p>
</div>
</div>
</section>

<h1 id="the-microns-dataset">The MICrONS dataset</h1>
<p>The largest connectome dataset ever produced:</p>
<br />
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Volume</strong></td>
<td>1 mm³ of mouse visual cortex</td>
</tr>
<tr>
<td><strong>Neurons</strong></td>
<td>~200,000</td>
</tr>
<tr>
<td><strong>Synapses</strong></td>
<td>~500,000,000</td>
</tr>
<tr>
<td><strong>Imaging</strong></td>
<td>Electron microscopy at 8×8×40 nm/voxel</td>
</tr>
</tbody>
</table>
<br />
<p>At 8 nm resolution you can see individual cell membranes, the synaptic cleft, and the thinnest axon branches threading between neighbours.</p>
<blockquote>
<p>Reconstructing the wiring diagram from this raw image stack is one of the central open problems in modern neuroscience. <strong>It is fundamentally a large-scale computer vision + clustering problem.</strong></p>
</blockquote>
</section>

<h1 id="from-pixels-to-neurons-segmentation">From pixels to neurons: segmentation</h1>
<p>The raw data is a 3D stack of grayscale EM images. To get neurons, a computer-vision pipeline assigns every voxel a <strong>segment ID</strong> (a.k.a. <strong>root ID</strong>) — ideally, all voxels of one neuron share one ID.</p>
<br />
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Raw EM voxels          Segmentation            Goal
  ┌─┬─┬─┬─┬─┐            ┌─┬─┬─┬─┬─┐
  │ │ │▓│ │ │            │1│1│▓│2│2│      all voxels of one
  │ │▓│▓│▓│ │   ──CV──►  │1│▓│▓│▓│2│  →   neuron share one ID
  │ │ │▓│ │ │            │1│1│▓│2│2│
  └─┴─┴─┴─┴─┘            └─┴─┴─┴─┴─┘
</code></pre>
<br />
<p>This is <strong>extraordinarily hard</strong>: neurites are thin, membranes are sometimes ambiguous, and a single neuron snakes through hundreds of microns in a complex tree shape. The segmentation is <strong>never perfect</strong>.</p>
</section>

<h1 id="two-versions-v117-and-v1412">Two versions: v117 and v1412</h1>
<p>Segmentation is iterated, not one-shot:</p>
<br />
<div class="columns">
<div>
<h3 id="v117--automated">v117 — automated</h3>
<p>Computer vision ran once and produced a complete labeling of the volume.</p>
<p><strong>It is noisy.</strong> This is the cheap, fast, error-prone output.</p>
<p>This is what we have at scale for fresh tissue.</p>
</div>
<div>
<h3 id="v1412--proofread">v1412 — proofread</h3>
<p>Human annotators reviewed v117, found errors, and corrected them.</p>
<p><strong>This is ground truth.</strong> Expensive — it took years of expert labor.</p>
<p>We train <em>against</em> it and evaluate <em>against</em> it.</p>
</div>
</div>
<br />
<blockquote>
<p>The whole point: we paid millions of dollars to produce v117 at scale. We cannot afford to proofread every neuron by hand. <strong>Can a model do the cleanup automatically?</strong></p>
</blockquote>
</section>

<h1 id="two-kinds-of-segmentation-error">Two kinds of segmentation error</h1>
<div class="columns">
<div>
<h3 id="splits-common">Splits (common)</h3>
<p>One real neuron broken into <strong>many</strong> v117 segments. The CV cut a neuron where it shouldn't have.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>   real neuron
   ████████████
        ↓ v117
   ███ ██ ████      ← 3 seg IDs
   1042 88 9931        for 1 neuron
</code></pre>
<p>Fix: <strong>merge</strong> the pieces back together.</p>
</div>
<div>
<h3 id="frankenmerges-rarer-worse">Frankenmerges (rarer, worse)</h3>
<p><strong>Two</strong> neurons fused into one v117 segment. The CV missed a membrane.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  neuron A   neuron B
   ███████ + ███████
        ↓ v117
   ██████████████     ← 1 seg ID
       seg 9912          for 2 neurons
</code></pre>
<p>Fix: <strong>ignore</strong> the false same-seg evidence.</p>
</div>
</div>
<br />
<p>Frankenmerges are worse: they inject <strong>false synaptic connections</strong> into the connectome, and a big merged blob looks locally plausible everywhere.</p>
</section>

<h1 id="the-task-in-one-sentence">The task, in one sentence</h1>
<blockquote>
<p>Given a set of synapses, each carrying a <strong>noisy v117 segment label</strong>, decide <strong>which synapses belong to the same neuron</strong>.</p>
</blockquote>
<br />
<p>This is a <strong>clustering / partition problem</strong>: group synapses into clusters, one cluster per physical neuron.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Synapse 0  (seg 1047)  ──┐
Synapse 1  (seg 1047)  ──┼──► Neuron A      same-seg → likely together
Synapse 2  (seg 2303)  ──┘                  but seg 2303 ≠ 1047 (a split!)
Synapse 3  (seg 9912)  ──────► Neuron B
Synapse 4  (seg 9912)  ──┐                  seg 9912 spans two neurons
Synapse 5  (seg 0041)  ──┴──► Neuron C      (a frankenmerge!)
</code></pre>
<p>We must <strong>see through</strong> splits (merge across seg IDs) and <strong>see past</strong> frankenmerges (don't blindly trust same-seg).</p>
</section>

<h1 id="the-key-insight-synapses-are-invariant">The key insight: synapses are invariant</h1>
<div class="columns">
<div>
<h3 id="segment-ids">Segment IDs</h3>
<ul>
<li>Change with <strong>every</strong> round of proofreading</li>
<li>v117 root ≠ v1412 root ≠ v1433 root</li>
<li>Bookkeeping that shifts under your feet</li>
</ul>
</div>
<div>
<h3 id="synapses">Synapses</h3>
<ul>
<li>Fixed physical events at fixed locations</li>
<li>A synapse is the <strong>same</strong> across all versions</li>
<li>The stable ground we build on</li>
</ul>
</div>
</div>
<br />
<p><strong>Consequence:</strong> if we cluster <em>synapses</em>, the partition we learn is <strong>stable across segmentation versions</strong>.</p>
<p>That's why every metric in <code>cluster.py</code> is defined on <strong>synapse pairs</strong>, never on segment IDs. A result computed on v117 stays valid when v1412 arrives.</p>
<blockquote>
<p>&quot;Synapses are the invariant nodes. We're finding cliques — which optimizes connectivity as intended and leads to natural metrics.&quot;</p>
</blockquote>
</section>

<h1 id="two-channels-of-evidence">Two channels of evidence</h1>
<p>How do we know two synapses share a neuron? Two signals:</p>
<br />
<div class="columns">
<div>
<h3 id="1-same-segment">1. Same-segment</h3>
<p>Two synapses with the <strong>same v117 seg ID</strong> are co-continuous in the automated segmentation.</p>
<p><strong>Strong but noisy.</strong> Correct when v117 is right; broken by splits; poisoned by frankenmerges.</p>
</div>
<div>
<h3 id="2-dna-similarity">2. DNA similarity</h3>
<p>A learned embedding of each segment's 3D <strong>skeleton shape</strong> — its branching, caliber, extent.</p>
<p><strong>The morphological fingerprint.</strong> Two segments with similar DNA are likely pieces of one neuron — even across a split.</p>
</div>
</div>
<br />
<blockquote>
<p>&quot;DNA&quot; is an analogy: just as biological DNA encodes an organism's identity, this embedding encodes a neuron piece's morphological identity. Produced by the <code>SkeletonGNN</code>. The model learns it from <strong>raw</strong> skeleton vertices — no hand-crafted features.</p>
</blockquote>
</section>

<h1 id="pipeline-overview">Pipeline overview</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>   Synapses + v117 seg IDs + skeletons
                  │
   ┌──────────────┘
   │  graph.py        build_synapse_graph()
   ▼
   SynapseGraph                          nodes = synapses
   (nodes + same-seg edges + spatial edges)   edges = evidence
                  │
   │  model.py        SynapseCoassigner (a GNN)
   ▼
   P(same neuron) for every edge         learned edge scores
                  │
   │  cluster.py      greedy_cluster() × K
   ▼
   K candidate partitions                ranked by likelihood
                  │
   │  cluster.py      pairwise_precision_recall, coverage_at_k
   ▼
   Metrics + human-review output
</code></pre>
<p>Each file has one clear job. <code>train.py</code> ties them together with a loss.</p>
</section>

<h1 id="step-1--build-the-synapsegraph">Step 1 — Build the SynapseGraph</h1>
<p><code>build_synapse_graph(positions, seg_ids, labels, seg_dna)</code> turns raw data into a graph with <strong>two edge types</strong>:</p>
<div class="columns">
<div>
<h3 id="same-segment-edges">Same-segment edges</h3>
<p><code>same_seg = 1.0</code></p>
<p>Connect every pair of synapses sharing a v117 seg ID.</p>
<p><em>Capped at 200 pairs per segment</em> — otherwise a frankenmerge with 10k synapses would create 50M edges (O(N²) blowup).</p>
</div>
<div>
<h3 id="spatial-k-nn-edges">Spatial k-NN edges</h3>
<p><code>same_seg = 0.0</code></p>
<p>Connect each synapse to its <strong>8 nearest neighbours</strong> in nm space.</p>
<p>Catches cross-segment proximity — two synapses from split pieces that happen to sit close together.</p>
</div>
</div>
<br />
<p><strong>Each node carries:</strong> <code>[x, y, z, dna_0 … dna_63]</code> — its position plus the DNA of its segment.<br />
<strong>Each edge carries:</strong> the <code>same_seg</code> flag (1.0 or 0.0).</p>
<p>Nothing else is hand-fed. The model decides what matters.</p>
</section>

<h1 id="step-2--score-edges-with-a-gnn">Step 2 — Score edges with a GNN</h1>
<p><code>SynapseCoassigner</code> reads the graph and outputs <strong>P(same neuron)</strong> per edge.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code> node features [x,y,z,dna…]  ──►  LayerNorm  (learned normalisation, no hardcoded scale)
                                      │
                       3 × message-passing layers:
                       msg    = Linear([h_neighbour ∥ same_seg])
                       update = Linear([h ∥ aggregated_msg]) → ReLU → LayerNorm
                                      │
                       per-synapse embedding h  [N, 64]
                                      │
        edge scorer:  MLP([ h_u ∥ h_v ∥ |h_u − h_v| ∥ same_seg ])  →  σ  →  P
</code></pre>
<br />
<p>Three deliberate choices, all in service of <em>&quot;avoid hardcoding features&quot;</em>:</p>
<ul>
<li><strong>LayerNorm at input</strong> — the network learns position scaling</li>
<li><strong><code>same_seg</code> is a plain input</strong> — not a hard gate; the model learns how much to trust it</li>
<li><strong>scorer sees both embeddings AND the raw flag</strong> — an explicit shortcut for the easy cases</li>
</ul>
</section>

<h1 id="step-3--cluster-into-neurons">Step 3 — Cluster into neurons</h1>
<p>We have P(same neuron) on every edge. Now find the <strong>partition</strong> that best agrees with those probabilities.</p>
<p>This is <strong>correlation clustering</strong> — NP-hard in general. We use the <strong>greedy pivot</strong> algorithm (O(E), 3-approximation):</p>
<br />
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Shuffle the synapses into a random order.
For each synapse not yet assigned:
    Look at neighbours already in a cluster, where P ≥ threshold.
    If any exist → join the cluster with the highest mean edge probability.
    Otherwise    → start a new cluster of its own.
</code></pre>
<br />
<p>Simple, fast, and good enough in practice. One pass over the edges produces one full partition of all synapses into neuron clusters.</p>
</section>

<h1 id="step-3-cont--k-materializations">Step 3 (cont.) — K materializations</h1>
<p>Run greedy <strong>K times</strong> with different random shuffles → K different partitions. Keep the K unique ones, <strong>sorted by log-likelihood</strong> (best first).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Materialization 1:  [A,B,C | D | E,F]      log-score −12.4   ← best
Materialization 2:  [A,B | C | D | E,F]    log-score −13.1
Materialization 3:  [A,B,C | D | E | F]    log-score −13.9
</code></pre>
<br />
<p><strong>Why several answers instead of one?</strong></p>
<p>A single partition gives no signal about <em>where</em> it was uncertain. With K partitions, the <strong>edges where they disagree</strong> are exactly the uncertain decisions — and that's where a human should look.</p>
<blockquote>
<p>coverage@K asks: does the <strong>true</strong> partition appear in the top-K? A well-calibrated model should include it even when no single answer is perfect.</p>
</blockquote>
</section>

<h1 id="step-4--train-the-model">Step 4 — Train the model</h1>
<p>Binary cross-entropy on edge labels: <strong>1</strong> if the two synapses share a v1412 neuron, <strong>0</strong> if not.</p>
<br />
<h3 id="the-problem-easy-negatives-dominate">The problem: easy negatives dominate</h3>
<p>Most random synapse pairs are from far-apart neurons — trivially &quot;different.&quot; Training on those teaches the model nothing.</p>
<h3 id="the-fix-hard-negative-mining">The fix: hard negative mining</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Over-sample the HARD negatives: spatially close, but different neurons</span>
hard_neg = spatial_edges where  label[src] != label[dst]   <span class="hljs-comment"># different neuron</span>
                            <span class="hljs-keyword">and</span>  label[src] &gt; <span class="hljs-number">0</span> <span class="hljs-keyword">and</span> label[dst] &gt; <span class="hljs-number">0</span>  <span class="hljs-comment"># both known</span>
<span class="hljs-comment"># 50% of each negative batch is drawn from this pool</span>
</code></pre>
<p>These are interdigitated neurons that sit right next to each other. Forcing the model to separate them is what makes it learn to <strong>use DNA</strong>, not just distance.</p>
</section>

<h1 id="synthetic-split-results">Synthetic-split results</h1>
<p>20 real proofread neurons (v1412), each cut into 3 pieces to <em>simulate</em> v117 splits. Synthetic synapses placed near skeleton vertices. Trained end-to-end on CPU, ~5 minutes.</p>

<th>Reading</th>

<td><strong>0.952</strong></td>
<td>Merges made are almost always correct</td>
</tr>
<tr>
<td>Pairwise recall</td>
<td><strong>0.420</strong></td>
<td>Under-merging — too cautious</td>
</tr>
<tr>

<td><strong>0.583</strong></td>

<p><strong>The story:</strong> the model <em>knows</em> which edges are safe — 95% precision means it rarely merges wrongly. It is declining to merge when unsure. The fixed <strong>threshold = 0.5 is too conservative</strong>; calibrating it should lift recall toward 0.8+ without hurting precision.</p>

<h1 id="the-v117-data-harness">The v117 data harness</h1>
<p><code>neuronauts/data/cave.py</code> connects the pipeline to real CAVE data in three calls:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> neuronauts.data.cave <span class="hljs-keyword">import</span> fetch_v117_region, encode_seg_dna
<span class="hljs-keyword">from</span> neuronauts.coassign <span class="hljs-keyword">import</span> build_synapse_graph, SynapseCoassigner, train

<span class="hljs-comment"># 1. Fetch real data: synapses + skeletons at v117, labels via v117→v1412 map</span>
region = fetch_v117_region(bbox_nm, token=CAVE_TOKEN, min_seg_synapses=<span class="hljs-number">2</span>,
                           skeleton_cache_dir=<span class="hljs-string">&quot;/tmp/cache&quot;</span>)
<span class="hljs-comment"># → positions_nm [N,3], seg_ids [N], gt_labels [N], skeletons{seg_id: SkeletonData}</span>

<span class="hljs-comment"># 2. Encode DNA from the fetched skeletons</span>
seg_dna = encode_seg_dna(region.skeletons, region.seg_ids)

<span class="hljs-comment"># 3. Build + train — identical from here to the synthetic demo</span>
graph = build_synapse_graph(region.positions_nm, region.seg_ids,
                            region.gt_labels, seg_dna)
train(SynapseCoassigner(node_dim=graph.node_dim), [graph])
</code></pre>
<br />
<p>The split between <strong>fetch</strong> (needs network) and <strong>encode</strong> (needs GPU) is intentional — cache skeletons once, re-encode freely.</p>

<h1 id="immediate-next-steps">Immediate next steps</h1>
<div class="columns">
<div>
<h3 id="1-threshold-calibration">1. Threshold calibration</h3>
<p><code>cluster.py</code> · <strong>biggest win</strong></p>
<p>The model learns good scores but threshold = 0.5 is too cautious.</p>
<p>Add <code>calibrate_threshold(model, graphs)</code>: sweep on held-out data, pick the F1-max value.</p>
<p><strong>Expected: recall 0.42 → 0.7+</strong></p>
</div>
<div>
<h3 id="3-endpoint-adjacent-edges">3. Endpoint-adjacent edges</h3>
<p><code>graph.py</code></p>
<p>Add a third edge type: skeleton <strong>leaf vertices</strong> that are spatially near each other across segments.</p>
<p>These are the principled bridge sites — exactly where the CV cut a neuron.</p>
<p><code>Fragment.endpoints_nm</code> is already populated.</p>
</div>
</div>
<br />
<h3 id="2-bigger-model-longer-training">2. Bigger model, longer training</h3>
<p>100–200 epochs · d_model 128–256 · 4–6 GNN layers. Real neurons span hundreds of microns; 3 layers × 8 hops ≈ 24-hop reach is too short.</p>
</section>

<h1 id="medium-term-see-through-the-noise">Medium-term: see through the noise</h1>
<h3 id="4-prototype-based-assignment-em-style">4. Prototype-based assignment (EM-style)</h3>
<p>The case that pure pairwise scoring <strong>fails</strong>: segments A and C belong to one neuron, but B between them is a frankenmerge with ambiguous DNA. A→B weak, B→C weak → A and C never connect.</p>
<p><strong>Fix:</strong> maintain a running embedding per <em>growing neuron hypothesis</em> (mean of its confirmed members). Assign each synapse to the closest hypothesis, or mark it uncertain. Iterate E / M steps. The prototype pools clean evidence from the <strong>whole arbor</strong>, bypassing local gaps.</p>
<br />
<h3 id="5-within-type-evaluation--the-honest-test">5. Within-type evaluation — the honest test</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">python scripts/coassign_demo.py --n-neurons 30 --n-pieces 3 --cell-type 23P
</code></pre>
<p>All neurons are L2/3 pyramidal — same type, similar shape. Cross-type precision (0.95) is partly <em>easy</em> cross-type separation. Within-type is the real difficulty.</p>
</section>

<h1 id="how-to-contribute">How to contribute</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>neuronauts/coassign/          ← 4 files, ~500 lines, one job each

├── cluster.py                ← greedy_cluster, materializations, metrics
└── train.py                  ← BCE + hard negative mining

scripts/coassign_demo.py      ← synthetic-split demo (~5 min on CPU)
scripts/v117_coassign.py      ← real v117 data harness
neuronauts/data/cave.py       ← CAVE fetch + DNA encode
tests/test_coassign.py        ← 25 tests, all green
</code></pre>
